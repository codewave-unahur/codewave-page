
services:
  codewave-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codewave-client
    image: codewave-client:v1.0
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-produccion}
    ports:
      - "3000:80"
    networks:
      - internal
    depends_on:
      - codewave-api
  codewave-api:
    build:
      context: .
      dockerfile: Dockerfile.server 
    container_name: codewave-api
    image: codewave-api:v1.0
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-produccion}
      - API_PORT=${API_PORT:-5000}
    restart: unless-stopped
    networks:
      - internal
  
  base-datos:
    image: mongo:6.0-rc-jammy
    container_name: base-datos
    environment:
      - MONGO_INITDB_ROOT_USERNAME=tu_usuario
      - MONGO_INITDB_ROOT_PASSWORD=tu_password
      - MONGO_INITDB_DATABASE=mi_base_datos
    volumes:
      - db-data:/data/db
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db-data:
    driver: local

networks:
  internal:
    driver: bridge
  
