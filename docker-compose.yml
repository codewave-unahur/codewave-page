
services:
  codewave-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codewave-client
    image: codewave-client:v1.0
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-produccion}
    ports:
      - "3000:80"
    networks:
      - codewave-network
    depends_on:
      - codewave-api

  codewave-api:
    build:
      context: .
      dockerfile: Dockerfile.server 
    container_name: codewave-api
    image: codewave-api:v1.0
    ports:
      - "5000:5000"         # Puerto de la API -> No exponer en producción
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-produccion}
      - API_PORT=${API_PORT:-5000}
      - MONGO_URI=${MONGO_URI}
    restart: unless-stopped
    networks:
      - codewave-network
    depends_on:
      mongodb: 
        condition: service_healthy
  
  mongodb:
    image: mongo:6.0.21-jammy
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-tu_usuario}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-tu_password}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-tu_base_de_datos}
    volumes:
      - db-data:/data/db
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - codewave-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db-data:
    driver: local

networks:
  codewave-network:
    driver: bridge
  
